site_name: !ENV [APP_NAME, 'SOLUTUS']
site_description: Manual do sistema
# URL pública completa do manual, com o prefixo /manual/. Sem isso, o MkDocs
# enraíza os links absolutos de 404.html em "/" (ex.: /assets/logo.png),
# ignorando o prefixo do site — o 404.html fica com CSS/JS/nav quebrados.
# O default cobre `mkdocs serve`/`mkdocs build` local; o pipeline substitui
# pela URL real do frontend (ver a etapa build-docs em cloudbuild.yaml).
site_url: !ENV [SITE_URL, 'http://localhost:8000/manual/']
docs_dir: docs/manual
site_dir: frontend/dist/manual

# Gera uma página por arquivo .html real, em vez do padrão do MkDocs
# (`pagina/index.html`, com links internos apontando para `pagina/`).
# O manual é servido pelo endpoint direto do Cloud Storage
# (`<bucket>.storage.googleapis.com`), que é a XML API: ela devolve objetos
# pela chave exata e NÃO aplica `MainPageSuffix` — isso só vale no endpoint
# de website ou atrás de um load balancer. Com o padrão, toda URL terminada
# em `/` responde `404 NoSuchKey`. Não remova sem colocar um load balancer
# na frente do bucket antes. Ver docs/manual/operacao/deploy.md.
use_directory_urls: false

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: pt-BR
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: pt

nav:
  - Início: index.md
  - Perfis:
      - Solicitante: perfis/solicitante.md
      - Técnico: perfis/tecnico.md
      - Gestor de TI e Diretor: perfis/gestor-diretor.md
      - Administrador: perfis/administrador.md
  - Funcionalidades:
      - Ciclo de vida do chamado: funcionalidades/ciclo-de-vida.md
      - Anexos: funcionalidades/anexos.md
      - Notificações: funcionalidades/notificacoes.md
      - Relatórios e dashboard: funcionalidades/relatorios-dashboard.md
  - Operação:
      - Arquitetura: operacao/arquitetura.md
      - Deploy: operacao/deploy.md
      - Acesso e segurança: operacao/acesso-e-seguranca.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
