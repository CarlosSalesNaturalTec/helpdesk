# Cloud Build CI/CD Pipeline — HelpDesk
# Trigger: push to main branch
# Architecture: 5 sequential stages (backend → frontend → docs manual)

substitutions:
  _REGION: us-central1
  _ARTIFACT_REGISTRY_REPO: helpdesk-repo
  _CLOUD_RUN_SERVICE: helpdesk-backend
  _CLOUD_SQL_INSTANCE: helpdesk-db
  _VITE_API_URL: https://helpdesk-backend-503116182148.us-central1.run.app
  _GCS_BUCKET_NAME: helpdesk-attachments-helpdesk-499614
  # Remetente dos e-mails de notificação. Deve ser um sender/domínio verificado
  # no SendGrid, caso contrário as mensagens são rejeitadas na entrega.
  _EMAIL_FROM: helpdesk@naturaltec.com.br
  # Nome da aplicação e do cliente, usados para compor o branding exibido no
  # frontend (título, navbar, login), nos e-mails de notificação e no relatório
  # em PDF. Ver backend/src/lib/branding.ts e frontend/src/config.ts.
  # ATENÇÃO: estes valores contêm espaços — sempre entre aspas onde forem
  # expandidos, e no --set-env-vars use o delimitador alternativo (^@^) para
  # tolerar vírgulas em nomes de cliente.
  _APP_NAME: SOLUTUS
  _CLIENT_NAME: Instituto Setes
  # URL base do frontend publicado no Firebase Hosting, usada para montar os
  # links dos e-mails (${FRONTEND_URL}/chamados/{id}) e como ALLOWED_ORIGIN do
  # CORS no Cloud Run — as duas vêm desta mesma substituição para não divergir.
  _FRONTEND_URL: https://helpdesk-499614.web.app

steps:
  # -----------------------------------------------------------------------
  # Stage 1: Build Docker image and push to Artifact Registry
  # -----------------------------------------------------------------------
  - id: 'docker-build'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CLOUD_RUN_SERVICE}:${COMMIT_SHA} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CLOUD_RUN_SERVICE}:latest \
          -f Dockerfile .
    timeout: 600s

  - id: 'docker-push'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CLOUD_RUN_SERVICE}:${COMMIT_SHA}
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CLOUD_RUN_SERVICE}:latest
    waitFor: ['docker-build']

  # -----------------------------------------------------------------------
  # Stage 2: Deploy to Cloud Run
  # -----------------------------------------------------------------------
  # IMPORTANT: The Cloud Run service account must be granted the "Storage Object Admin"
  # role (roles/storage.objectAdmin) in IAM or directly on the ${_GCS_BUCKET_NAME} bucket
  # to be able to upload and delete ticket attachments.
  - id: 'deploy-cloud-run'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy ${_CLOUD_RUN_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_CLOUD_RUN_SERVICE}:${COMMIT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --concurrency=80 \
          --timeout=300 \
          --port=3001 \
          --set-env-vars="NODE_ENV=production,HOST=0.0.0.0,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}" \
          --set-env-vars="EMAIL_FROM=${_EMAIL_FROM},FRONTEND_URL=${_FRONTEND_URL}" \
          --set-env-vars="^@^APP_NAME=${_APP_NAME}@CLIENT_NAME=${_CLIENT_NAME}" \
          --set-env-vars="ALLOWED_ORIGIN=${_FRONTEND_URL}" \
          --set-secrets=DATABASE_URL=helpdesk-database-url:latest \
          --set-secrets=JWT_SECRET=helpdesk-jwt-secret:latest \
          --set-secrets=SENDGRID_API_KEY=helpdesk-sendgrid-api-key:latest \
          --add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_CLOUD_SQL_INSTANCE}
    waitFor: ['docker-push']

  # -----------------------------------------------------------------------
  # Stage 3: Build frontend
  # -----------------------------------------------------------------------
  - id: 'build-frontend'
    name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        npm run build --workspace=shared
        VITE_API_URL="${_VITE_API_URL}" VITE_APP_NAME="${_APP_NAME}" VITE_CLIENT_NAME="${_CLIENT_NAME}" npm run build --workspace=frontend
    waitFor: ['deploy-cloud-run']

  # -----------------------------------------------------------------------
  # Stage 4: Build documentation manual (MkDocs)
  # -----------------------------------------------------------------------
  # Runs after build-frontend (which cleans frontend/dist/ before the Vite
  # build) and before deploy-frontend, so the manual survives inside the
  # same tree that gets published. site_dir in mkdocs.yml points directly at
  # frontend/dist/manual/, so the manual is published by the same
  # `firebase deploy` below — no separate site or upload step needed.
  - id: 'build-docs'
    name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements-docs.txt
        APP_NAME="${_APP_NAME}" SITE_URL="${_FRONTEND_URL}/manual/" mkdocs build --strict
    waitFor: ['build-frontend']

  # -----------------------------------------------------------------------
  # Stage 5: Publish frontend (app + manual) to Firebase Hosting
  # -----------------------------------------------------------------------
  # firebase-tools authenticates via Application Default Credentials when no
  # token is supplied — in Cloud Build that resolves to the build's own
  # service account through the metadata server, so no FIREBASE_TOKEN needs
  # to live in Secret Manager. The service account needs
  # roles/firebasehosting.admin (see docs/Deploy_GCP.md, Passo 8). Rewrites
  # and Cache-Control headers are declared in firebase.json, so no
  # per-object metadata step is needed here.
  - id: 'deploy-frontend'
    name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project ${PROJECT_ID} --non-interactive
    waitFor: ['build-docs']

# ---------------------------------------------------------------------------
# Options
# ---------------------------------------------------------------------------
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

timeout: 1800s
