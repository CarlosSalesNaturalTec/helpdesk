schema: spec-driven

context: |
  System name: SOLUTUS — Instituto Setes. Branding is configurable at build/deploy time via APP_NAME/CLIENT_NAME (backend) and VITE_APP_NAME/VITE_CLIENT_NAME (frontend), both defaulting to "SOLUTUS" / "Instituto Setes" — see backend/src/lib/branding.ts and frontend/src/config.ts.
  Repo layout: npm workspaces monorepo — shared/ (@helpdesk/shared: Zod schemas + inferred types), backend/ (@helpdesk/backend: Fastify API), frontend/ (Vite SPA), prisma/ at repo root (schema, migrations, seed), openspec/, docs/. Build shared before backend/frontend.
  Tech stack: React 18 + TypeScript + React Router v6 + TanStack React Query + Axios (frontend), Node.js 20 + TypeScript + Fastify 4 (backend), PostgreSQL 15 + Prisma 5 (ORM), Zod validation shared front↔back, JWT (15 min) + bcryptjs auth, PDFKit (server-side PDF), Recharts + html-to-image (charts, chart snapshot posted to the PDF endpoint), @fastify/multipart + @google-cloud/storage (ticket attachments), @sendgrid/mail (email)
  Infrastructure (production, Google Cloud Platform, region us-central1): Cloud Run (helpdesk-backend, port 3001, 512 MiB / 1 vCPU, min-instances=0, max-instances=3), Cloud SQL PostgreSQL 15 (helpdesk-db, db-g1-small in production / db-f1-micro for dev), Cloud Storage (one bucket for the static frontend, one for ticket attachments with public objects), Artifact Registry (helpdesk-repo), Secret Manager (database URL, JWT secret, SendGrid key), Cloud Build CI/CD triggered on push to main (cloudbuild.yaml), SendGrid for email. The container runs `prisma migrate deploy` on start, so every deploy applies pending migrations.
  Domain: HelpDesk for an Instituto with multiple Unidades. 5 personas: Solicitante (opens tickets), Técnico (resolves tickets, scoped to their Unidade AND their Tipo de Ocorrência), Gestor de TI (manages unit tickets + local users), Diretor (oversees unit + local users), Administrador do Sistema (global admin across all units, sole manager of Unidades, Tipos de Ocorrência and Tipos de Problema)
  Domain terminology: the Prisma model `Sector` is presented to users as "Tipo de Ocorrência" — the rename is UI/copy only; model, API paths (/api/sectors) and code identifiers (sectorId) keep the original names. `ProblemType` ("Tipo de Problema") belongs to a Sector and carries slaMinutes.
  Ticket lifecycle: ABERTO → EM_ANDAMENTO → RESOLVIDO → FECHADO, with EM_ANDAMENTO ↔ AGUARDANDO and FECHADO → REABERTO → EM_ANDAMENTO. Transitions validated server-side by validateTransition() and recorded in TicketHistory. Tickets carry an optional single attachment (JPG/PNG/PDF/DOCX, max 5 MB) stored in Cloud Storage.
  Conventions: TypeScript strict mode, Prisma migrations, Zod schemas shared front↔back, conventional commits, sequential changes for solo developer, user-facing copy in pt-BR. No automated test suite — backend/src/test-*.ts are manual tsx smoke scripts run against a live database.
  Key constraint: Data isolation between Unidades — Técnico/Gestor/Diretor only see their own Unidade's data (Técnico additionally narrowed to their own Tipo de Ocorrência); Solicitante only sees their own tickets; Admin sees everything.
  Other invariants: Ticket.numero is BigInt and MUST be serialized to string in API responses; status enums must stay consistent across the Prisma schema, the shared Zod enums and ALLOWED_TRANSITIONS; notification/email failures must never break the underlying ticket operation.

rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 4 hours for solo developer
    - If the change adds a feature or alters user-facing behavior, include "atualizar docs/manual/" as a standard item in the verification section
